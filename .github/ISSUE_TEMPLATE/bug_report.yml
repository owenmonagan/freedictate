name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "e.g. macOS 15.1, Apple Silicon"
    validations:
      required: true
  - type: input
    id: button
    attributes:
      label: Talk button
      placeholder: "e.g. Right Option, mouse button 4"
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Hold, Tap, Both]
  - type: textarea
    id: logs
    attributes:
      label: Hammerspoon console output
      description: Paste anything relevant from the Hammerspoon console.
      render: text
