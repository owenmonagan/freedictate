<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dictate HUD</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="hud.css">
</head>
<body data-state="hidden">
<div id="stage">
  <div id="glow" aria-hidden="true"></div>
  <div id="hud" aria-hidden="true">
    <div id="press">
      <div id="shake">
        <div class="shape"><div class="fill">
          <div class="lcap"></div>
          <div class="slab"></div>
          <div class="rcap"></div>
        </div></div>
        <div class="content">
          <!-- listening -->
          <div class="face" data-face="listening">
            <span class="lead">
              <span class="dot"></span>
              <svg class="lock" viewBox="0 0 10 10" width="10" height="10" aria-hidden="true">
                <rect x="1.75" y="4.5" width="6.5" height="4.75" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.5"/>
                <path d="M3.25 4.5V3.2a1.75 1.75 0 0 1 3.5 0v1.3" fill="none" stroke="currentColor" stroke-width="1.5"/>
              </svg>
            </span>
            <span class="meter"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
            <span class="kbd">esc</span>
          </div>
          <!-- transcribing -->
          <div class="face" data-face="starting">
            <svg viewBox="0 0 14 14" width="14" height="14" class="ring start" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            <span class="label">One moment</span>
          </div>

          <div class="face" data-face="transcribing">
            <svg class="spinner" viewBox="0 0 14 14" width="14" height="14" aria-hidden="true">
              <path d="M7 1.25A5.75 5.75 0 1 1 1.25 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span class="label shimmer">Transcribing<span class="ell">…</span></span>
          </div>
          <!-- done with text -->
          <div class="face" data-face="done">
            <svg class="check" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <path d="M3.5 8.4l3 3 6-6.6" pathLength="1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="label"><span class="pasted">Pasted</span><span class="preview"></span></span>
          </div>
          <!-- done, nothing heard -->
          <div class="face" data-face="empty">
            <svg viewBox="0 0 14 14" width="14" height="14" class="ring" aria-hidden="true"><circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
            <span class="label dim">Nothing heard</span>
          </div>
          <!-- cancelled -->
          <div class="face" data-face="cancelled">
            <svg viewBox="0 0 12 12" width="12" height="12" class="x" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <span class="label dim">Cancelled</span>
          </div>
          <!-- error -->
          <div class="face" data-face="error">
            <svg viewBox="0 0 14 14" width="14" height="14" class="warn" aria-hidden="true">
              <path d="M7 1.6L13 12.2H1z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
              <path d="M7 5.4v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <circle cx="7" cy="10.3" r=".85" fill="currentColor"/>
            </svg>
            <span class="label msg"></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="live" class="sr-only" role="status" aria-live="polite"></div>
<script src="hud.js"></script>
</body>
</html>
